<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Countdowns to Las Vegas / Metallica at the Sphere and Steamboat Hiking 2027">
  <meta name="theme-color" content="#000000">
  <title>Vegas &amp; Steamboat Countdown</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="deck" id="deck">

    <section class="slide slide--vegas" aria-label="Las Vegas, Metallica at the Sphere">
      <div class="slide-bg"></div>
      <div class="content">
        <h1 class="eyebrow">Las Vegas</h1>
        <p class="event-when">Thursday, February 25, 2027 &mdash; 2:00 PM Las Vegas time</p>

        <div class="countdown" data-target="2027-02-25T22:00:00Z">
          <div class="time-block">
            <span class="time-value" data-unit="days">000</span>
            <span class="time-label">Days</span>
          </div>
          <div class="time-block">
            <span class="time-value" data-unit="hours">00</span>
            <span class="time-label">Hours</span>
          </div>
          <div class="time-block">
            <span class="time-value" data-unit="minutes">00</span>
            <span class="time-label">Minutes</span>
          </div>
          <div class="time-block">
            <span class="time-value" data-unit="seconds">00</span>
            <span class="time-label">Seconds</span>
          </div>
        </div>
      </div>
    </section>

    <section class="slide slide--steamboat" aria-label="Steamboat Hiking">
      <div class="slide-bg"></div>
      <div class="content">
        <h1 class="title">Hike Steamboat &rsquo;27</h1>
        <p class="event-when">Thursday, August 5, 2027 &mdash; 12:00 PM Mountain</p>

        <div class="countdown" data-target="2027-08-05T18:00:00Z">
          <div class="time-block">
            <span class="time-value" data-unit="days">000</span>
            <span class="time-label">Days</span>
          </div>
          <div class="time-block">
            <span class="time-value" data-unit="hours">00</span>
            <span class="time-label">Hours</span>
          </div>
          <div class="time-block">
            <span class="time-value" data-unit="minutes">00</span>
            <span class="time-label">Minutes</span>
          </div>
          <div class="time-block">
            <span class="time-value" data-unit="seconds">00</span>
            <span class="time-label">Seconds</span>
          </div>
        </div>

        <div class="verified-badge">VERIFIED</div>
      </div>
    </section>

  </div>

  <!-- Swipe affordance: dots show how many events there are and which one is showing. -->
  <nav class="pager" id="pager" aria-label="Events">
    <button type="button" class="pager-dot" data-goto="0">
      <span class="pager-dot-label">Vegas</span>
    </button>
    <button type="button" class="pager-dot" data-goto="1">
      <span class="pager-dot-label">Steamboat</span>
    </button>
  </nav>

  <div class="swipe-hint" id="swipeHint" aria-hidden="true">
    Swipe
    <span class="swipe-hint-arrow">&rsaquo;</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
